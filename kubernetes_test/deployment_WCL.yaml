apiVersion: apps/v1
kind: Deployment
metadata:
  name: wcl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      nodeName: node2.demo1.rtcontainer-pg0.wisc.cloudlab.us
      containers:
      - name: wcl
        image: kaobinchou/weather-color-light-smartapp-nodejs:latest  # Replace with your Docker image name
        ports:
        - containerPort: 3001
        securityContext:
          privileged: true
