apiVersion: apps/v1
kind: Deployment
metadata:
  name: aa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      nodeName: node2.demo1.rtcontainer-pg0.wisc.cloudlab.us
      containers:
      - name: aa
        image: kaobinchou/api-access-app:latest  # Replace with your Docker image name
        ports:
        - containerPort: 3002
        securityContext:
          privileged: true
