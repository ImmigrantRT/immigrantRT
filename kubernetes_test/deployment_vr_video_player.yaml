apiVersion: apps/v1
kind: Deployment
metadata:
  name: vr-video-player
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      nodeName: node2.demo1.rtcontainer-pg0.wisc.cloudlab.us
      containers:
      - name: vr-video-player
        image: kaobinchou/vr_video_player:latest  # Replace with your Docker image name
        securityContext:
          privileged: true
